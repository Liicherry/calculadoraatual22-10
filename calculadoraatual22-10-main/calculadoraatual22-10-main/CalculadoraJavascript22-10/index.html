<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
</head>
<body>
    
    <div class="calculator">
        <div class="result">0</div>
        <div class="buttons">

            <button class="bg_cinza">C</button>
            <button class="bg_cinza">±</button>
            <button class="bg_cinza">%</button>
            <button class="bg_purple">÷</button>

            <button class="bg-cinza_claro">7</button>
            <button class="bg-cinza_claro">8</button>
            <button class="bg-cinza_claro">9</button>
            <button class="bg_purple">x</button>

            <button class="bg-cinza_claro">4</button>
            <button class="bg-cinza_claro">5</button>
            <button class="bg-cinza_claro">6</button>
            <button class="bg_purple">-</button>

            <button class="bg-cinza_claro">1</button>
            <button class="bg-cinza_claro">2</button>
            <button class="bg-cinza_claro">3</button>
            <button class="bg_purple">+</button>

            <button class="bg-cinza_claro button_zero">0</button>
            <button class="bg-cinza_claro">,</button>
            <button class="bg_purple">=</button>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
